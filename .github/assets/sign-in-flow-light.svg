<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="Sign-in flow with optional second factor"><rect width="1280" height="600" rx="20" fill="#ffffff"/><defs><marker id="a-188" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6478"/></marker></defs><text x="60" y="64" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14183d" text-anchor="start" letter-spacing="0">How a sign-in becomes a token</text><text x="60" y="94" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">Every sign-in method passes the same second-factor check before a token is issued.</text><rect x="60" y="150" width="260" height="76" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/><circle cx="90" cy="188.0" r="15" fill="#e9f6fc"/><text x="90" y="193.0" font-family="'Ubuntu Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#44c0eb" text-anchor="middle" letter-spacing="0">pw</text><text x="116" y="185.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="start" letter-spacing="0">Password</text><text x="116" y="206.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">email, phone or username</text><path d="M320 188 C 350 188, 350 308, 384 308" fill="none" stroke="#5b6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-188)"/><rect x="60" y="270" width="260" height="76" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/><circle cx="90" cy="308.0" r="15" fill="#e9f6fc"/><text x="90" y="313.0" font-family="'Ubuntu Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#44c0eb" text-anchor="middle" letter-spacing="0">id</text><text x="116" y="305.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="start" letter-spacing="0">OAuth and Firebase</text><text x="116" y="326.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">Google, Apple and others</text><path d="M320 308 C 350 308, 350 308, 384 308" fill="none" stroke="#5b6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-188)"/><rect x="60" y="390" width="260" height="76" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/><circle cx="90" cy="428.0" r="15" fill="#e9f6fc"/><text x="90" y="433.0" font-family="'Ubuntu Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#44c0eb" text-anchor="middle" letter-spacing="0">pk</text><text x="116" y="425.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="start" letter-spacing="0">Passkey</text><text x="116" y="446.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">WebAuthn credential</text><path d="M320 428 C 350 428, 350 308, 384 308" fill="none" stroke="#5b6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-188)"/><rect x="388" y="262" width="220" height="92" rx="16" fill="#e9f6fc" stroke="#44c0eb" stroke-width="2"/><text x="498" y="300" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="middle" letter-spacing="0">Confirmed second</text><text x="498" y="324" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="middle" letter-spacing="0">factor on account?</text><path d="M608 290 C 660 290, 660 168, 716 168" fill="none" stroke="#5b6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-188)"/><text x="650" y="214" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5b6478" text-anchor="start" letter-spacing="0">no</text><rect x="720" y="130" width="240" height="76" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/><circle cx="750" cy="168.0" r="15" fill="#e9f6fc"/><text x="750" y="173.0" font-family="'Ubuntu Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#44c0eb" text-anchor="middle" letter-spacing="0">ok</text><text x="776" y="165.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="start" letter-spacing="0">Access token</text><text x="776" y="186.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">Sanctum bearer, ready to use</text><path d="M608 326 C 660 326, 660 418, 716 418" fill="none" stroke="#5b6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-188)"/><text x="650" y="392" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#44c0eb" text-anchor="start" letter-spacing="0">yes</text><rect x="720" y="380" width="240" height="76" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/><circle cx="750" cy="418.0" r="15" fill="#e9f6fc"/><text x="750" y="423.0" font-family="'Ubuntu Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#44c0eb" text-anchor="middle" letter-spacing="0">2f</text><text x="776" y="415.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14183d" text-anchor="start" letter-spacing="0">Pending 2FA token</text><text x="776" y="436.0" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">two_factor_token, 5 minutes</text><path d="M960 418 H 1006" fill="none" stroke="#5b6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-188)"/><rect x="1010" y="380" width="210" height="76" rx="14" fill="#2d398e"/><text x="1030" y="413" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">Access token</text><text x="1030" y="435" font-family="'Ubuntu Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="start" letter-spacing="0">ability: 2fa-verified</text><text x="720" y="500" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">Complete the challenge with any of:</text><rect x="720" y="516" width="95" height="32" rx="16" fill="#e9f6fc"/><text x="767.5" y="537" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#2d398e" text-anchor="middle" letter-spacing="0">TOTP code</text><rect x="823" y="516" width="156" height="32" rx="16" fill="#e9f6fc"/><text x="901.0" y="537" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#2d398e" text-anchor="middle" letter-spacing="0">Email or SMS code</text><rect x="987" y="516" width="103" height="32" rx="16" fill="#e9f6fc"/><text x="1038.5" y="537" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#2d398e" text-anchor="middle" letter-spacing="0">Magic link</text><rect x="1098" y="516" width="126" height="32" rx="16" fill="#e9f6fc"/><text x="1161.0" y="537" font-family="Ubuntu, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#2d398e" text-anchor="middle" letter-spacing="0">Recovery code</text></svg>
